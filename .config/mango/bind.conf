# reload config
bind=SUPER,r,reload_config

# dms
bind=ALT,Return,spawn,kitty
bind=ALT,d,spawn,dms ipc call spotlight toggle
bind=ALT,v,spawn,dms ipc call clipboard toggle
bind=ALT,m,spawn,dms ipc call processlist toggle
bind=ALT,s,spawn,dms ipc call settings toggle
bind=ALT,n,spawn,dms ipc call notifications toggle
bind=ALT+SHIFT,n,spawn,dms ipc call notepad toggle
bind=ALT+SHIFT,minus,spawn,dms ipc call powermenu toggle
bind=SUPER,l,spawn,dms ipc call lock lock
bind=none,XF86AudioRaiseVolume,spawn,dms ipc call audio increment 3
bind=none,XF86AudioLowerVolume,spawn,dms ipc call audio decrement 3
bind=none,XF86AudioMute,spawn,dms ipc call audio mute
bind=none,XF86AudioMicMute,spawn,dms ipc call audio micmute
bind=none,XF86MonBrightnessUp,spawn,dms ipc call brightness increment 2 ""
bind=none,XF86MonBrightnessDown,spawn,dms ipc call brightness decrement 2 ""

# exit super+m
bind=ALT+SHIFT,e,quit
# killclient super+q
bind=ALT+SHIFT,q,killclient,

# switch window focus
bind=ALT,h,focusdir,left
bind=ALT,l,focusdir,right
bind=ALT,k,focusdir,up
bind=ALT,j,focusdir,down

# swap window
bind=ALT+SHIFT,k,exchange_client,up
bind=ALT+SHIFT,j,exchange_client,down
bind=ALT+SHIFT,h,exchange_client,left
bind=ALT+SHIFT,l,exchange_client,right

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

# resizewin
bind=ALT,i,resizewin,+0,-50
bind=ALT,u,resizewin,+0,+50
bind=ALT,y,resizewin,-50,+0
bind=ALT,o,resizewin,+50,+0

# switch window status
bind=SUPER,g,toggleglobal,
bind=ALT,f,togglemaximizescreen,
bind=ALT+SHIFT,f,togglefullscreen,
bind=ALT,minus,minimized,
bind=ALT,equal,restore_minimized
bind=ALT+SHIFT,o,toggleoverview,
bind=ALT,space,togglefloating,
bind=ALT+SHIFT,space,toggleoverlay,

# scroller layout
bind=ALT,r,switch_proportion_preset,
bind=ALT,e,set_proportion,1.0

# tile layout
bind=SUPER,e,incnmaster,1
bind=SUPER,b,incnmaster,-1

# switch layout
bind=SUPER,t,setlayout,tile
bind=SUPER,s,setlayout,scroller
bind=SUPER,n,switch_layout

# tag switch
bind=SUPER,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

# 只看某个tag的窗口
bind=ALT,1,view,1,0
bind=ALT,2,view,2,0
bind=ALT,3,view,3,0
bind=ALT,4,view,4,0
bind=ALT,5,view,5,0
bind=ALT,6,view,6,0
bind=ALT,7,view,7,0
bind=ALT,8,view,8,0
bind=ALT,9,view,9,0

# 将当前窗口切换成唯一的某个tag
bind=ALT+SHIFT,1,tag,1,0
bind=ALT+SHIFT,2,tag,2,0
bind=ALT+SHIFT,3,tag,3,0
bind=ALT+SHIFT,4,tag,4,0
bind=ALT+SHIFT,5,tag,5,0
bind=ALT+SHIFT,6,tag,6,0
bind=ALT+SHIFT,7,tag,7,0
bind=ALT+SHIFT,8,tag,8,0
bind=ALT+SHIFT,9,tag,9,0

# 将当前窗口添加/移除多个tag
bind=ctrl,1,toggletag,1
bind=ctrl,2,toggletag,2
bind=ctrl,3,toggletag,3
bind=ctrl,4,toggletag,4
bind=ctrl,5,toggletag,5
bind=ctrl,6,toggletag,6
bind=ctrl,7,toggletag,7
bind=ctrl,8,toggletag,8
bind=ctrl,9,toggletag,9

# 允许以当前tag的形式临时查看具有其他tag的窗口
bind=Super,1,toggleview,1
bind=Super,2,toggleview,2
bind=Super,3,toggleview,3
bind=Super,4,toggleview,4
bind=Super,5,toggleview,5
bind=Super,6,toggleview,6
bind=Super,7,toggleview,7
bind=Super,8,toggleview,8
bind=Super,9,toggleview,9

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=alt+shift,Up,focusmon,up
bind=alt+shift,Down,focusmon,down
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right
bind=SUPER+Alt,Up,tagmon,up
bind=SUPER+Alt,Down,tagmon,down

# Mouse Button Bindings
mousebind=ALT,btn_left,moveresize,curmove
mousebind=ALT,btn_right,moveresize,curresize
mousebind=NONE,btn_left,toggleoverview,1
mousebind=NONE,btn_right,killclient,0

# Gesturebind
gesturebind=none,left,3,focusdir,right
gesturebind=none,right,3,focusdir,left
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,left,4,viewtoright_have_client
gesturebind=none,right,4,viewtoleft_have_client
gesturebind=none,up,4,toggleoverview,1
gesturebind=none,down,4,toggleoverview,1

#custom app bind
bind=none,Print,spawn,flameshot gui
bind=CTRL,Print,spawn,flameshot gui --region screen0
bind=CTRL+SHIFT,m,spawn,curl 127.0.0.1:60828/selection_translate
bind=CTRL+SHIFT,p,spawn,curl 127.0.0.1:60828/
bind=CTRL+SHIFT,l,spawn,curl 127.0.0.1:60828/ocr_translate
